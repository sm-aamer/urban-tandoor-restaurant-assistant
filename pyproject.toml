[project]
name = "urban-tandoor-restaurant-assistant"
version = "0.1.0"
description = "A modular restaurant assistant backend for Urban Tandoor & Grill"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "google-genai>=3.6.1",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["."]
